<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="/src/output.css" rel="stylesheet">
  <style>
    @keyframes circle{
      to{transform: rotate(360deg);}
    }

    @keyframes musicBars {
    0%, 100% {
      transform: scaleY(0.4);
    }

    50% {
      transform: scaleY(1);
    }
  }

  .bar {
    transform-origin: bottom;
    animation: musicBars 0.8s ease-in-out infinite;
    animation-play-state: paused;
  }

  .bar:nth-child(1) {
    animation-delay: 0s;
  }

  .bar:nth-child(2) {
    animation-delay: 0.2s;
  }

  .bar:nth-child(3) {
    animation-delay: 0.4s;
  }

  .bar:nth-child(4) {
    animation-delay: 0.1s;
  }

  .bar:nth-child(5) {
    animation-delay: 0.3s;
  }

  .bar:nth-child(6) {
    animation-delay: 0.5s;
  }

  .bar:nth-child(7) {
    animation-delay: 0.2s;
  }

  </style>
</head>
<body class="bg-gray-800 text-white">
    <div class="mx-auto p-10">
      <div class="w-65 h-125 border border-gray-600 rounded-2xl mx-auto shadow-lg shadow-gray-900 px-5 py-3">
        
        <div class="flex flex-row justify-between items-center mb-4">
          <h5 class="uppercase tracking-[4px] font-bold text-[10px] text-red-200" >Midnight</h5>
          <span class="text-[10px] text-gray-500">VOL.01</span>
        </div>

        <!-- second card -->
        <div class="aspect-square mx-auto rounded-2xl shadow shadow-gray-900 bg-[linear-gradient(145deg,#f5bd91,#c57e91,#665485)] overflow-hidden p-3 mb-4 relative">

          <!-- two bg-circle -->
          <div class="flex flex-row relative top-35">
              <div class="absolute -left-22 w-65 h-65 rounded-full bg-[#40304f]/30"></div>
              <div class="absolute left-10 w-65 h-65 rounded-full bg-[#40304f]/40"></div>
         </div>
          
         <h6 class="uppercase text-[#40304f]/80 text-[8px] tracking-[2px] font-bold">The slow hours</h6>

         <!-- parent plate -->
         <div id="record" aria-hidden="true" class="music-animation relative top-5 left-6 grid size-[75%] place-items-center rounded-full bg-[repeating-radial-gradient(circle,#18181c_0px,#18181c_2px,#303034_3px,#18181c_4px)] shadow-[10px_15px_30px_#00000060]">
          <div class="absolute inset-0 rounded-full bg-[conic-gradient(transparent,#ffffff18,transparent,transparent,#ffffff18,transparent)]"></div>
          <!-- child plate -->
            <div class="w-11 h-11 rounded-full bg-orange-200 flex flex-col items-center justify-center gap-1.5">
              <h5 class="text-black text-[8px] font-medium uppercase">slow</h5>
              <div class="w-2 h-2 rounded-full bg-black"></div>
            </div>

          </div>
          <h6 class="uppercase text-[8px] font-medium text-gray-400 absolute bottom-3 left-36">side a / 33 rpm</h6>

        </div>

        <div class="flex flex-col justify-between items-center">
          <h5 class="font-medium text-md mb-1">After The Rain</h5>
          <h6 class="text-[11px] text-gray-400 mb-3">The Slow Hours</h6>

          <div id="main-bar" class="flex justify-between items-end gap-1 mb-5">
            <div class="bar w-0.75 h-2 bg-orange-200"></div>
            <div class="bar w-0.75 h-5 bg-orange-200 rounded-sm"></div>
            <div class="bar w-0.75 h-3 bg-orange-200"></div>
            <div class="bar w-0.75 h-5 bg-orange-200 rounded-sm"></div>
            <div class="bar w-0.75 h-4 bg-orange-200"></div>
            <div class="bar w-0.75 h-3 bg-orange-200 rounded-sm"></div>
            <div class="bar w-0.75 h-2 bg-orange-200"></div>
         </div>

          <div id="playBtn" class="w-10 h-10 rounded-full bg-orange-200 mb-3 relative">
            
            <svg id="pauseBtn" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-solid lucide-pause absolute top-2.5 left-2 text-black hidden fill-black"><rect x="14" y="3" width="5" height="18" rx="1"/><rect x="5" y="3" width="5" height="18" rx="1"/>
            </svg>
            <svg id="startBtn" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-solid lucide-play absolute top-2.5 left-2 text-black fill-black"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/>
            </svg>

          </div>

          <h5 id="playText" class="text-[10px] text-gray-400 mb-3 hidden">Playing . enjoy the slow moments</h5>
          <h5 id="pauseText" class="text-[10px] text-gray-400 mb-3 hidden">Paused .take your time</h5>
          <h5 id="startText" class="text-[10px] text-gray-400 mb-3">Click play to start the animation</h5>
        </div>

          <div class="uppercase text-[8px] tracking-[2px] text-gray-500 text-center mt-5">Visual demo . slow moments</div>
        </div>
        
        
      </div>
        
    </div>

    <script>
      const record = document.getElementById('record');
      const playBtn = document.getElementById('playBtn');
      const startBtn = document.getElementById('startBtn');
      const pauseBtn = document.getElementById('pauseBtn');
      const playText = document.getElementById('playText');
      const pauseText = document.getElementById('pauseText');
      const startText = document.getElementById('startText');
      const bars = document.querySelectorAll(".bar");

      let isPlaying = false;

    playBtn.addEventListener("click", function () {

      if (isPlaying) {

        record.style.animationPlayState = "paused";

        bars.forEach(function(bar) {
        bar.style.animationPlayState = "paused";
        });

        pauseBtn.classList.add("hidden");
        startBtn.classList.remove("hidden");
        
        playText.classList.add("hidden");
        pauseText.classList.remove("hidden");
        startText.classList.add("hidden");

        isPlaying = false;

      } else {

        record.style.animation = "circle 10s linear infinite";

        bars.forEach(function(bar) {
        bar.style.animationPlayState = "running";
        });

        
        startBtn.classList.add("hidden");
        pauseBtn.classList.remove("hidden");

        

        playText.classList.remove("hidden");
        pauseText.classList.add("hidden");
        startText.classList.add("hidden");

        isPlaying = true;
      }

    });

    </script>
</body>
</html>
